<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Три варианта открытия — Александр Курбатов</title><style>
*{box-sizing:border-box}body{margin:0;background:#171a1d;color:#f3f4f5;font:14px Arial,sans-serif}header{padding:16px 24px;background:#0b0d0e;border-bottom:1px solid #353a40} .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}strong{font-size:15px;margin-right:auto}button{border:1px solid #424950;border-radius:6px;background:transparent;color:inherit;padding:10px 14px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#2997ff;border-color:#2997ff;color:#08131c}button:hover{border-color:#2997ff}button:focus-visible{outline:2px solid white;outline-offset:3px}p{margin:12px 0 0;color:#afb9c2;font-size:12px;line-height:1.5}main{height:calc(100dvh - 122px);min-height:400px;display:flex;justify-content:center}iframe{border:0;width:100%;height:100%;background:#0b0d0e}main.mobile iframe{width:min(390px,100%);border-left:1px solid #424950;border-right:1px solid #424950}@media(max-width:700px){header{padding:12px}strong{width:100%}button{padding:9px 11px;font-size:12px}main{height:calc(100dvh - 184px)}} </style></head><body><header><div class="row"><strong>Открытие сайта · три варианта</strong><button data-mode="1" aria-pressed="true">1 · Мягкое</button><button data-mode="2" aria-pressed="false">2 · Поэтапное</button><button data-mode="3" aria-pressed="false">3 · Масштаб</button><button id="replay">↻ Повторить</button><button id="mobile" aria-pressed="false">Мобильный вид</button></div><p id="description" aria-live="polite">1 · Мягкое проявление за 1 секунду. Отдельный предпросмотр — основная страница не изменена.</p></header><main><iframe title="Предпросмотр главного экрана" src="intro-stage.html?variant=1"></iframe></main><script>
let mode=1;const frame=document.querySelector('iframe');const copy=['','1 · Мягкое проявление за 1 секунду.','2 · Фон → имя → фото → описание и навигация. Около 1,5 секунды.','3 · Лёгкое масштабирование фото и плавное проявление. Около 1,8 секунды.'];
function replay(){frame.src='intro-stage.html?variant='+mode+'&replay='+Date.now();}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=Number(b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#description').textContent=copy[mode]+' Отдельный предпросмотр — основная страница не изменена.';replay();}));
document.querySelector('#replay').addEventListener('click',replay);
document.querySelector('#mobile').addEventListener('click',e=>{const enabled=document.querySelector('main').classList.toggle('mobile');e.currentTarget.setAttribute('aria-pressed',String(enabled));e.currentTarget.textContent=enabled?'На всю ширину':'Мобильный вид';replay();});
</script></body></html>
